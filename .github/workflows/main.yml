name: Daily Hotspot Report

on:
  schedule:
    # 主跑：每天 UTC 00:23（北京时间 08:23）。刻意避开整点——GitHub 官方提示
    # "the start of every hour" 是 Actions 的触发高峰，此时 schedule 事件会被
    # 延迟甚至静默丢弃。
    - cron: '23 0 * * *'
    # 补跑窗口 ×3（北京 11:23 / 14:23 / 17:23）。
    # 2026-09-23 复盘：只错峰到 00:23 并不够——当天 00:23 过后 2 小时 14 分仍无任何
    # 运行记录（不是失败，是压根没被调度）。改为一天 4 个互不相邻的窗口；
    # 任一窗口成功产出后，其余窗口由下面的 guard job 识别并跳过，
    # 不会重复提交、不会重复消耗 AI 额度。
    - cron: '23 3 * * *'
    - cron: '23 6 * * *'
    - cron: '23 9 * * *'
  workflow_dispatch:
    # 允许手动触发

# 同一时刻只保留一个运行实例，避免定时任务与手动触发并发时产生 git push 冲突
concurrency:
  group: daily-hotspot-report
  cancel-in-progress: false

jobs:
  # 幂等守卫：当天快照已存在，说明今天已经跑成功过（四条 cron 都落在同一 UTC 日内），
  # 本次就是补跑窗口里的重复触发——直接跳过 build，避免重复提交与重复消耗 AI 额度。
  # 日期取 UTC，与 daily_report.py 中 generate_daily_snapshot 的
  # `datetime.now(timezone.utc)` 文件命名口径严格一致；所有 cron 也都在 UTC 同一日内，
  # 因此 guard 看到的就是"今天是否已产出"这个事实。
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check today's snapshot
        id: check
        run: |
          TODAY=$(date -u +%F)
          if [ -f "docs/data/daily/${TODAY}.json" ]; then
            echo "今日快照 docs/data/daily/${TODAY}.json 已存在，跳过本次运行"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "今日（${TODAY}）快照尚未生成，继续执行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 限制单次任务时长：抓取+生成一般 5-10 分钟即可完成，超时即失败并触发通知，避免任务长期挂起
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 缓存 pip 下载包，显著缩短重复运行的依赖安装耗时
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 依赖清单统一放在 requirements.txt（已固定版本），避免 CI 每天静默装上
          # 上游最新版导致"昨天能跑、今天突然失败"。trafilatura 为主正文提取器，
          # readability-lxml / html2text 为其失败时的降级链。
          pip install -r requirements.txt

      - name: Run daily report generator
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          BAIDU_APPID: ${{ secrets.BAIDU_APPID }}
          BAIDU_SECRET_KEY: ${{ secrets.BAIDU_SECRET_KEY }}
        run: |
          python daily_report.py

      # 数据文件结构校验：三个手工维护的 JSON（schools / careers / jobs）与
      # 流水线新产出的 recruit.json 都在这里过一遍。放「提交之前」是为了让坏数据
      # 根本进不了仓库——历史上曾因为 schools.json 少一个字段导致整页白屏，
      # 而且只有用户打开网页才会发现。校验不过直接失败，不提交。
      - name: Validate data files
        run: python validate_data.py

      # sitemap 的 lastmod 原先停在手写那天，之后再没更新过——搜索引擎看到的是
      # 「这个站点很久没变」。提交前把它刷成当天日期。
      - name: Refresh sitemap lastmod
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s#<lastmod>[0-9-]*</lastmod>#<lastmod>${TODAY}</lastmod>#" docs/sitemap.xml
          grep -o "<lastmod>[0-9-]*</lastmod>" docs/sitemap.xml

      - name: Commit and push data changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase origin main || true
          git add docs/data/
          git add docs/sitemap.xml
          git add personal_knowledge.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update daily hotspot report $(date -u +%Y-%m-%d)"
          git push

      - name: Package backup files
        if: success()
        run: |
          mkdir -p /tmp/backup
          cp docs/data/history.csv /tmp/backup/ 2>/dev/null || true
          cp docs/data/glossary.json /tmp/backup/ 2>/dev/null || true
          cp docs/data/learning_path.json /tmp/backup/ 2>/dev/null || true
          cd /tmp/backup
          zip -r "hotspot-backup-$(date -u +%Y-%m-%d).zip" .
          echo "BACKUP_FILE=/tmp/backup/hotspot-backup-$(date -u +%Y-%m-%d).zip" >> $GITHUB_ENV

      - name: Upload backup to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup
          name: "数据备份"
          body: |
            ## 环境学子雷达 - 数据备份

            自动备份日期：${{ github.event.head_commit.timestamp || '手动触发' }}

            包含文件：
            - history.csv — 历史记录
            - glossary.json — 环境知识库
            - learning_path.json — 学习路径

            > 此 Release 由 GitHub Actions 自动更新，每次运行覆盖最新备份。
          files: |
            ${{ env.BACKUP_FILE }}
          fail_on_unmatched_files: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Failure notification (ntfy.sh)
        if: failure()
        # 通知主题从仓库 Secret 读取：未配置则明确跳过。
        # 注意：切勿把主题名硬编码进工作流——ntfy 的公共主题任何人订阅即可读，会泄漏仓库信息。
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "未配置 secret NTFY_TOPIC，跳过失败通知（如需启用：仓库 Settings > Secrets 添加 NTFY_TOPIC）"
            exit 0
          fi
          curl -s -X POST "https://ntfy.sh/$NTFY_TOPIC" \
            -H "Title: 环境学子雷达 - 工作流失败" \
            -H "Priority: high" \
            -d "每日热点报告生成失败，请检查 GitHub Actions 日志。仓库: ${{ github.repository }}" \
            || echo "通知发送失败（ntfy.sh 不可达）"
