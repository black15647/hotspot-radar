name: Daily Hotspot Report

on:
  schedule:
    # 每天 UTC 00:00 运行（北京时间 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser pyyaml jieba readability-lxml html2text requests

      - name: Run daily report generator
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          python daily_report.py

      - name: Commit and push data changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/
          git add personal_knowledge.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update daily hotspot report $(date -u +%Y-%m-%d)"
          git push

      - name: Package backup files
        if: success()
        run: |
          mkdir -p /tmp/backup
          cp docs/data/history.csv /tmp/backup/ 2>/dev/null || true
          cp docs/data/glossary.json /tmp/backup/ 2>/dev/null || true
          cp docs/data/learning_path.json /tmp/backup/ 2>/dev/null || true
          cd /tmp/backup
          zip -r "hotspot-backup-$(date -u +%Y-%m-%d).zip" .
          echo "BACKUP_FILE=/tmp/backup/hotspot-backup-$(date -u +%Y-%m-%d).zip" >> $GITHUB_ENV

      - name: Upload backup to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup
          name: "数据备份"
          body: |
            ## 环境学子雷达 - 数据备份
            
            自动备份日期：${{ github.event.head_commit.timestamp || '手动触发' }}
            
            包含文件：
            - history.csv — 历史记录
            - glossary.json — 环境知识库
            - learning_path.json — 学习路径
            
            > 此 Release 由 GitHub Actions 自动更新，每次运行覆盖最新备份。
          files: |
            ${{ env.BACKUP_FILE }}
          fail_on_unmatched_files: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Failure notification (ntfy.sh)
        if: failure()
        run: |
          curl -s -X POST "https://ntfy.sh/your-topic" \
            -H "Title: 环境学子雷达 - 工作流失败" \
            -H "Priority: high" \
            -d "每日热点报告生成失败，请检查 GitHub Actions 日志。仓库: ${{ github.repository }}" \
            || echo "通知发送失败（可能是 ntfy.sh 未配置）"
