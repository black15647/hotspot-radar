name: Watchdog - 今日产出巡检

# 为什么需要这个工作流：
#   Daily Hotspot Report 里的 ntfy 通知挂在 `if: failure()` 上，只有"跑起来但失败"才会响。
#   而 schedule 事件无论被丢弃还是晚到几小时，都不会产生 failure —— 全程零告警。
#   2026-09-22 / 09-23 / 09-24 连续三天都是这样：用户在中午发现"今天没跑"。
#   这个工作流只做一件事：确认"今天到底有没有产出"，没有就把静默变成声音。
#
# ⚠ 它的触发时间要设在"最晚的那个观察日之后"才有效：
#    按 2026-09-22~23 的实测，schedule 事件会晚到 4.5~5.5 小时，
#    即北京 08:23 的窗口实际在北京 12:50~13:50 才产出。
#    因此这里设在 UTC 12:13（北京 20:13），晚于全部窗口 + 迟到余量。
#
# 注意：本工作流同样依赖 GitHub 的 schedule，理论上也可能不跑。因此它是"多一道防线"，
#   不是"万无一失"。真正与 GitHub 调度器无关的那道防线在你自己电脑上（每日 21:05 巡检）。

on:
  schedule:
    - cron: '13 12 * * *'   # UTC 12:13 = 北京 20:13
  workflow_dispatch:

permissions:
  contents: read
  # 2026-10-29：从 read 提到 write。
  #   read  —— 归因要读 main.yml 当天的运行记录（见下方「今天到底跑没跑」）；
  #   write —— 自愈要用同一套 API 反手触发一次 main.yml（见下方「自动补跑」）。
  # write 隐含 read，所以只写一行，不重复列。
  actions: write

# 手动触发与定时触发撞车时串行执行，避免同一时刻补跑两次。
# 注意：main.yml 自己另有 group=daily-hotspot-report 的并发保护，
# 所以这里的串行只是减少无意义的重复请求，不是仓库安全的必要条件。
concurrency:
  group: watchdog-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify today's snapshot exists
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%F)
          F="docs/data/daily/${TODAY}.json"
          if [ -f "$F" ]; then
            SIZE=$(wc -c < "$F")
            echo "OK：${F} 已生成（${SIZE} 字节）"
            # 顺手记一笔：快照异常小通常意味着当天抓取几乎全灭，也值得看一眼。
            if [ "$SIZE" -lt 500 ]; then
              echo "::warning::${F} 只有 ${SIZE} 字节，明显偏小，建议检查当天抓取日志"
            fi
            exit 0
          fi

          # 归因（2026-10-19 加）：不能一律写成「没有被调度」。
          # 10-18 那天实际被调度了 4 次，每次都跑满 25 分钟被 timeout-minutes 强杀，
          # 旧文案会把排查方向直接带偏（去查调度器，真正该查的是执行耗时）。
          # 这里先查一眼「今天 main.yml 跑过几次、结论是什么」；API 挂了就退回 unknown，
          # 不影响下面的告警与退出码。
          DAY_START="${TODAY}T00:00:00Z"
          RUNS_JSON=$(curl -s --max-time 20 -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/main.yml/runs?created=%3E%3D${DAY_START}&per_page=5" || true)
          # 只做字符串统计，不引 jq/python：少一个依赖就少一个失败点。
          # run_attempt 每个 run 只出现一次；conclusion 在"仍在运行"时是 null，故另行兜底。
          #
          # 2026-10-29 修：原来写的是 `grep -c '"run_attempt":'`，但 -c 数的是**行数**，
          # 而 GitHub 返回的是紧凑单行 JSON → 无论实际跑了 4 次还是 1 次，结果恒为 1。
          # 实测（本地 mock 3 个 run）确实吐出"今天已运行 1 次"。改成 grep -o | wc -l
          # 才是数"匹配次数"。这个数字是排查时第一眼要看的，错了会把方向带偏。
          # 同时正则容忍键值间空格（"conclusion": "x"），不依赖压缩格式。
          RUN_COUNT=$(printf '%s' "$RUNS_JSON" | grep -o '"run_attempt"' | wc -l | tr -d ' ')
          CONCL=$(printf '%s' "$RUNS_JSON" | grep -o '"conclusion": *"[a-z]*"' \
            | sed 's/.*"\([a-z]*\)"$/\1/' | tr '\n' ',' | sed 's/,$//' || true)
          if printf '%s' "$RUNS_JSON" | grep -q '"message"'; then
            RUN_INFO="归因未知（运行记录查询失败，多为 token 权限不足）"
          elif [ "${RUN_COUNT:-0}" -eq 0 ]; then
            RUN_INFO="今天 0 次运行 → 确实未被调度"
          else
            [ -z "$CONCL" ] && CONCL="仍在运行"
            RUN_INFO="今天已运行 ${RUN_COUNT} 次，结论：${CONCL}"
          fi
          echo "归因：${RUN_INFO}"

          echo "::error::今日（${TODAY}）快照缺失 —— ${RUN_INFO}"
          echo "排查入口：https://github.com/${{ github.repository }}/actions/workflows/main.yml"

          # ---- 自动补跑（2026-10-29 加）----
          # 10-29 的教训：当天 4 个 cron 窗口被 GitHub 直接丢了 3 个，最后靠
          # 第 4 个窗口晚到 6.5 小时才补上。这种「根本没跑」不会产生 failure，
          # main.yml 里的 if: failure() 通知永远不会响——巡检既然已经确认
          # 「今天没产出」，就别只喊人，顺手用 API 反手补一次。
          #
          # 为什么不会写出重复数据 / 死循环：
          #   · main.yml 的 guard 先查当天快照，已存在则整个 run 跳过 → 重复触发无副作用；
          #   · main.yml 的 concurrency 是 daily-hotspot-report + cancel-in-progress:false，
          #     哪怕此刻有 schedule run 正在排队，两次也会**串行**执行，
          #     后者的 guard 一定会看到前者刚提交的快照，不会并发写仓库；
          #   · 用 GITHUB_TOKEN 调 workflow_dispatch 是官方允许的例外
          #     （push/pull_request 才防递归），不存在自己触发自己的循环——
          #     watchdog 触发的是 main.yml，而 main.yml 不会触发 watchdog。
          echo "尝试自动补跑一次 Daily Hotspot Report…"
          DISPATCH_CODE=$(curl -s -o /tmp/dispatch.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/main.yml/dispatches" \
            -d '{"ref":"main"}' || echo "000")
          if [ "$DISPATCH_CODE" = "204" ]; then
            echo "补跑已提交（HTTP 204），Actions 页会出现一次 workflow_dispatch 运行"
            AUTO_FIX="已自动补跑一次"
          else
            echo "::warning::自动补跑失败（HTTP ${DISPATCH_CODE}），响应体见下"
            # 响应体用来区分原因：403 → token 缺 actions: write；
            # 404 → 工作流文件名不对或未在默认分支启用。末尾补 echo 是因为
            # 响应体通常不带换行，否则会和下一行日志粘在一起。
            cat /tmp/dispatch.json 2>/dev/null | head -c 500 || true
            echo
            AUTO_FIX="自动补跑失败（HTTP ${DISPATCH_CODE}），需手动触发"
          fi
          echo "结果：${AUTO_FIX}"

          if [ -z "$NTFY_TOPIC" ]; then
            echo "未配置 secret NTFY_TOPIC，跳过手机推送"
            exit 1
          fi
          curl -s -X POST "https://ntfy.sh/$NTFY_TOPIC" \
            -H "Title: 环境学子雷达 - 今日未产出" \
            -H "Priority: high" \
            -H "Click: https://github.com/${{ github.repository }}/actions/workflows/main.yml" \
            -d "到 UTC $(date -u +%H:%M) 为止，docs/data/daily/${TODAY}.json 仍未生成。${RUN_INFO}。${AUTO_FIX}。" \
            || echo "ntfy.sh 不可达，推送失败"
          exit 1
