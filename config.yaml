# ---------- 可选：热度权重配置 ----------
# ⚠️ 只要这里写了 source_weights，daily_report.py 里的 DEFAULT_SOURCE_WEIGHTS 就**完全不生效**
# （与 rss_feeds 同款机制）。新增信源后务必在这里补一行，否则该源会悄悄落到默认值 1.0。
# 权重映射成「权威度」分（v3.0）：18 * sqrt(w - 1)，全程 0-18 无常数底分。
#   w=1.0→0    1.2→8.0    1.3→9.9    1.4→11.4    1.5→12.7    2.0→18.0
#   用开方而非线性：压缩高权重端的优势，避免 6 个顶刊源垄断榜单前列。
#   （v2.1 旧口径是 15+(w-1)*10，其中 15 分是常数项 —— 常数不参与排序，
#    实际只有 8 分在起作用，满分 25 里 68% 是白占的。）
# 不再有「跨源共振只统计权威来源」的权重门槛：共振改为按「同一事件的
# 不同原始报道媒体数」统计，与来源权重解耦（旧门槛 1.3 与产出重叠度最高的
# 那批 1.2 权重源相冲突，导致该项在线上恒为 0）。
weights:
  source_weights:
    # 顶刊（学术前沿，环境专业核心参考）2.0 → 权威度 18.0
    "Nature": 2.0
    "Nature Sustainability": 2.0
    "Science": 2.0
    "PNAS 环境科学": 2.0
    "Environmental Research Letters": 2.0
    "Water Research": 2.0
    # 专业环境媒体 / 科普（有完整编辑流程与正文摘要，信息密度高）1.5 → 权威度 12.7
    "The Guardian Environment": 1.5
    "BBC 科学与环境": 1.5
    "Yale Environment 360": 1.5
    "ScienceDaily 环境科学": 1.5
    # 中文环境垂直媒体（2026-09-20 新增）1.5/1.4/1.3 → 权威度 12.7/11.4/9.9
    #   依据：这些是环境领域**有编辑流程的专业媒体与官方发布**，与卫报/BBC 的环境频道同级，
    #   理应高于「宽泛聚合查询」的 1.2（此前正是那几个泛查询在产地方政务通稿）。
    "Google News 中国环境网": 1.5      # 生态环境部机关报
    "Google News 生态环境部": 1.5      # 官方政策原文（还会叠加 content_density 的政策加分）
    "Google News 北极星环保网": 1.4    # 环保行业资讯
    "Google News 中国水网": 1.3        # 水务垂直
    "人民网 环保频道": 1.3             # 官方媒体环境频道（原生 RSS，100 条）
    # 精准主题查询（结果本身就是学生要的考研/竞赛/招聘信息）1.4 → 权威度 11.4
    "Google News 环境考研": 1.4
    "Google News 环境竞赛": 1.4
    "Google News 环保招聘": 1.4
    "Google News 环境校招实习": 1.4
    "Google News 生态环境局招聘": 1.4
    # 学术机构 / 国际组织 1.2
    "arXiv Environmental Engineering": 1.2
    "IISD SDG": 1.2
    "Berkeley Earth": 1.2
    "Adaptation Fund": 1.2
    # 宽泛聚合查询 1.2 → 权威度 8.0
    # 2026-09-20 由 1.5 下调：这四个查询词（环境保护/气候变化/生态环境/环境污染）结果
    # 与真实环境议题的重合度最低，实测线上 28 条里它们贡献了全部 4 条地方政务通稿。
    # 原值 1.5 高于卫报/BBC 的 1.0，属权重倒挂——泛聚合查询不该比专业环境媒体更权威。
    "Google News 环境保护": 1.2
    "Google News 气候变化": 1.2
    "Google News 生态环境": 1.2
    "Google News 环境污染": 1.2
    # 其他未列出的来源默认权重 1.0 → 权威度 0 分
  time_decay: 0.8        # 时间衰减系数
  keyword_bonus: 2.0     # 每个匹配关键词的加分

# ---------- 可选：内容信息密度配置（v2.1 新增的乘性系数）----------
# 与标题长度无关，只看"程序性内容"与"实质议题"的比例（见 evaluate_content_density）：
#   国家级/部委级主体 + 方案/办法/规划/标准等规范性文件词  -> policy_bonus
#   地方行政层级 + 环境机构/会议调研动作/宣传体裁 且无研究信号 -> boilerplate_penalty
#   短标题且无领域词也无研究信号                          -> thin_penalty
# 只想关掉它就把 enabled 设为 False。
content_density:
  enabled: True
  boilerplate_penalty: 0.65   # 地方政务通稿（省督察组调研督导、XX局网友见面会…）
  thin_penalty: 0.85          # 薄内容
  policy_bonus: 1.10          # 国家级政策文件（重拳整治监测数据造假、新污染物治理行动方案…）
  # 通稿配额：-1 = 只降权、不删（默认，榜单条数不变）；
  #           0 = 通稿全部不上榜；N = 每天最多保留 N 条。
  # 降权解决"排哪儿"，本项解决"上不上榜"——实测一次运行可能有 5 条通稿占 5/28 个槽位。
  max_boilerplate: -1


# ---------- 可选：热度算法参数（v3.0）----------
# 热度 = 四个加性维度之和 × 时间衰减 × 信息密度 × 重复惩罚，再标定到 40-100 展示分。
# 四个维度各自独立、可解释：
#   权威度   谁在说
#   话题分   说的是不是当下有价值的题（IDF 稀缺度 + 当日聚集度）
#   事件共振 多少家不同媒体在报道同一件事
#   信息量   说得多具体（量化信息 / 具体主体 / 研究信号 / 可读描述）
# 想看单条的逐维分解：点卡片上的热度分徽章，弹窗会列出每一项的得分与推导。
hotness:
  dimensions:
    authority: 18.0      # 权威度满分
    topic: 18.0          # 话题分满分
    resonance: 18.0      # 事件共振满分
    information: 16.0    # 信息量满分
  topic:
    idf_max: 12.0        # 关键词 IDF 稀缺度上限（罕见话题得分高）
    burst_max: 6.0       # 当日聚集度上限（同一话题今天被越多条命中越高）
    floor: 3.0           # 零命中兜底（关键词表未覆盖、但标题确属环境题材）
  resonance:
    # 饱和常数：同一事件被 2 家媒体报 → 8.8 分，3 家 → 13.1 分，4 家 → 15.7 分
    tau: 1.5
  event_cluster:
    # 「同一事件」判定：标题 token 重叠系数 |A∩B|/min(|A|,|B|)。
    # 不用 Jaccard —— 中文标题长短差异大，长标题会稀释 Jaccard。
    # 实测同一事件的两条标题：Jaccard 0.25（被旧阈值 0.45 漏判）/ overlap 0.60（命中）。
    overlap_threshold: 0.50
    duplicate_penalty: 0.60   # 同一事件中非代表条目的降权系数
  display:
    # absolute（默认）：40 + 60*(1-exp(-raw/k))
    #   同一个 raw 在任何一天都得到同一个分 → 热度分可跨日比较；
    #   "今天没什么热点"会如实显示为整榜分数偏低，而不是被强行拉满到 100。
    # relative：旧的逐日 min-max 到 40-100，仅用于复现历史口径
    #   （缺点：无论当天内容整体多差，榜首永远 100 分、榜尾永远 40 分）。
    mode: "absolute"
    k: 20.0              # 标定常数：越大分越平，越小越容易拉开

# ---------- 可选：AI 摘要生成配置 ----------
summary_api:
  enabled: True
  api_key: ""
  model: "nvidia/nemotron-3.5-lightning-30b-a3b"
  fallback_model: "nvidia/nemotron-3-nano-30b-a3b"
  base_url: "https://integrate.api.nvidia.com/v1/"
  max_tokens: 100

  # ---- AI 调用治理（防 429 限流）----
  # 所有 AI 请求都经过同一套闸门：速率限制 → 并发闸门 → 失败重试(退避+抖动+Retry-After)
  # → 结果缓存。任何功能都不得绕过，因此这里的值对全流程一致生效。
  # 下面为保守默认值，可按实际配额调整（调大需自负 429 风险）。
  limits:
    rpm: 30                  # 每分钟最多发起的 AI 请求数（免费层实测上限 40，留 25% 余量）
    max_concurrency: 1       # 同时在飞的请求数上限（流程本身串行，此项是显式约束）
    max_calls_per_run: 80    # 单次运行的请求预算，超出后剩余 AI 功能降级为规则模式
    jitter_ratio: 0.25       # 退避抖动比例（只向上抖动，避免多请求同步重试再撞同一限流窗口）
    max_backoff: 60          # 单次退避等待上限（秒）；服务端 Retry-After 要求更久时不受此限
    cache_enabled: True      # 进程内结果缓存：同一 prompt 重复调用不再发请求
    cache_max_entries: 512   # 缓存条数上限，超出按写入顺序淘汰最早的一批
    honor_retry_after: True  # 是否采信服务端 Retry-After 建议的等待时长

  # ---- AI 参与算法流程 ----
  # 目前只有一项：语义事件聚类，为热度算法 v3.0 的「事件共振」维度提供输入。
  # 关掉或 AI 不可用时，热度算法自动回退到标题 token 重叠系数聚类（确定性，无外部依赖），
  # 因此事件共振维度不会因为 AI 挂掉而消失。
  algorithm_ai:
    semantic_event_clustering: True   # 是否用 AI 做语义事件聚类
    max_items: 60                     # 单次最多送给 AI 的条数（超出部分按独立事件处理）

