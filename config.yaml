  # ---- 中文环境垂直媒体（2026-09-20 新增，site: 定向查询）----
  # 为什么走 Google News 而不是直接订阅这些站：
  #   对 20 个中文环境类站点做了首页 RSS 自动发现 + 逐条路径实测 —— 中国环境网、北极星、
  #   环保在线、中国水网、固废网、澎湃、界面、果壳、科学网**全部不提供可用 RSS**
  #   （要吗 404、要吗返回 HTML 页面，feedparser 解析出 0 条）。RSSHub 公共实例
  #   rsshub.app 在本机与境外出口**双重不可达**（数据中心 IP 被其反爬拦截）。
  #   而 site: 查询复用本项目已在 Actions 稳定运行 30 天的 Google News 通道，
  #   不引入任何新域名的地域封锁风险。
  #
  # when: 窗口为什么是 7d / 30d（实测）：
